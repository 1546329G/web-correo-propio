# LABORATORIO: instalación independiente de Bulwark (edición completa).
# Se espera que Stalwart ya esté instalado y exista JMAP HTTPS accesible.
# Este archivo omite JMAP_SERVER_URL para mostrar asistente inicial.
# El token del wizard aparece en logs; nunca compartirlo.
# El puerto 3100 solo queda disponible en localhost: publicar por túnel seguro.
services:
  bulwark:
    image: ghcr.io/bulwarkmail/webmail:1
    container_name: bulwark
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      # Si aquí estableces JMAP_SERVER_URL, se omite el wizard.
      # JMAP_SERVER_URL: "https://mail.example.com"
    volumes:
      - bulwark-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  bulwark-data:
